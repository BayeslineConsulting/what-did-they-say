name: fetch
on:
  push:
    branches: [tmp-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while read s; do
            curl -sS -L -m 60 -A "$UA" -o "out/$s.json" -w "$s api %{http_code} %{size_download}\n" "https://www.churchofjesuschrist.org/study/api/v3/language-pages/type/content?lang=eng&uri=/general-conference/2026/10/$s" || true
            curl -sS -L -m 60 -A "$UA" -o "out/$s.html" -w "$s html %{http_code} %{size_download}\n" "https://www.churchofjesuschrist.org/study/general-conference/2026/10/$s?lang=eng" || true
            sleep 1
          done < slugs.txt | tee out/log.txt
          curl -sS -L -m 60 -A "$UA" -o "out/index.json" "https://www.churchofjesuschrist.org/study/api/v3/language-pages/type/content?lang=eng&uri=/general-conference/2026/10" || true
          curl -sS -L -m 60 -A "$UA" -o "out/index.html" "https://www.churchofjesuschrist.org/study/general-conference/2026/10?lang=eng" || true
          tar czf out.tgz out
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.tgz -out out.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.enc
          git config user.name "fetch"; git config user.email "fetch@users.noreply.github.com"
          git add out.enc k.enc out/log.txt -f
          git commit -m "fetched"
          git push
